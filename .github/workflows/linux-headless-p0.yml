name: Drawborad Linux headless P0
on:
  push:
    branches: [work/linux-headless-engine-20261104, work/native-stroke-editor-20261106]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'apps/headless/**'
      - 'cloud/**'
      - 'src/**'
      - 'src/ui/**'
      - 'src/codecs/**'
      - 'tools/qa/headless_evidence.py'
      - 'tools/packaging/**'
      - 'tools/experiments/**'
      - 'tools/segmentation/**'
      - 'tests/**'
      - '.github/workflows/linux-headless-p0.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'apps/headless/**'
      - 'cloud/**'
      - 'src/**'
      - 'src/ui/**'
      - 'src/codecs/**'
      - 'tools/qa/headless_evidence.py'
      - 'tools/packaging/**'
      - 'tools/experiments/**'
      - 'tools/segmentation/**'
      - 'tests/**'
      - '.github/workflows/linux-headless-p0.yml'
permissions:
  contents: read
concurrency:
  group: drawborad-linux-headless-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-base-private-dev libpng-dev zlib1g-dev libjpeg-dev libtiff-dev libwebp-dev libheif-dev liblcms2-dev python3 python3-pil
      - name: Configure headless workflow
        shell: bash
        run: |
          mkdir -p out/evidence
          cmake -S . -B out/linux-headless -G Ninja -DCMAKE_BUILD_TYPE=Release -DDRAWBORAD_HEADLESS_WORKFLOW=ON -DDRAWBORAD_DESKTOP=OFF -DDRAWBORAD_QUALIFY=OFF -DDRAWBORAD_ONNXRUNTIME_ROOT= 2>&1 | tee out/evidence/configure.log
      - name: Build
        shell: bash
        run: cmake --build out/linux-headless --parallel 2 2>&1 | tee out/evidence/build.log
      - name: Preserve native binary for integration debugging
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-binary-${{ github.sha }}
          path: out/linux-headless/DrawboradHeadless
      - name: Run portable and headless tests
        shell: bash
        run: |
          ctest --test-dir out/linux-headless --show-only=json-v1 > out/evidence/ctest-inventory.json
          ctest --test-dir out/linux-headless --output-on-failure --no-tests=error --output-junit "$PWD/out/evidence/ctest.xml" 2>&1 | tee out/evidence/ctest.log
      - name: Native persistent editing contract
        run: python3 tests/headless/test_session.py out/linux-headless/DrawboradHeadless
      - name: Python project API and existing runtime tests
        run: |
          python3 -m venv --system-site-packages out/api-venv
          out/api-venv/bin/pip install -r cloud/requirements.txt pytest httpx opencv-python-headless
          export PATH="$PWD/out/api-venv/bin:$PATH"
          DRAWBORAD_TEST_ENGINE="$PWD/out/linux-headless/DrawboradHeadless" python -m pytest tests/cloud -q
      - name: Generate genuine C++ painting artifacts
        run: out/linux-headless/DrawboradHeadless smoke --output out/evidence/painting > out/evidence/smoke-stdout.json
      - name: Independently verify ORA and collect receipts
        run: |
          python3 tests/headless/verify_artifacts.py out/evidence/painting > out/evidence/ora-validation.json
          python3 tools/qa/headless_evidence.py out/linux-headless out/evidence
      - name: Reconstruct a public real photograph
        run: |
          sudo apt-get install -y python3-skimage python3-opencv
          python3 tools/segmentation/test_guided_grabcut.py | tee out/evidence/guided-segmentation-tests.log
          python3 tools/experiments/real_photo.py out/evidence/real-input
          out/linux-headless/DrawboradHeadless run --manifest "$PWD/out/evidence/real-input/manifest.json" --output out/evidence/real-painting --accept-all > out/evidence/real-photo-run.json
          python3 tests/headless/verify_artifacts.py out/evidence/real-painting > out/evidence/real-photo-ora.json
      - name: Independent real-photo HTTP editing acceptance
        run: out/api-venv/bin/python tests/cloud/http_native_acceptance.py out/linux-headless/DrawboradHeadless out/evidence/real-input out/evidence/editor
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless-p0-${{ github.sha }}
          path: out/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Package native Ubuntu runtime
        run: |
          mkdir -p out/runtime
          cp out/linux-headless/DrawboradHeadless out/runtime/
          cp tools/packaging/install-runtime-ubuntu.sh tools/packaging/README.md out/runtime/
          cp tests/headless/verify_artifacts.py out/evidence/readiness.json out/runtime/
          ldd out/runtime/DrawboradHeadless > out/runtime/build-linked-libraries.txt
          (cd out/runtime && sha256sum DrawboradHeadless install-runtime-ubuntu.sh README.md verify_artifacts.py readiness.json build-linked-libraries.txt > SHA256SUMS)
          tar -czf out/DrawboradHeadless-ubuntu24-x86_64.tar.gz -C out/runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless-runtime-${{ github.sha }}
          path: out/DrawboradHeadless-ubuntu24-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Package the authenticated editor for a persistent host
        run: |
          tar czf out/DrawboradNativeEditor-ubuntu24-amd64.tar.gz \
            -C tools/packaging/native-editor Dockerfile compose.yaml README.md .dockerignore \
            -C "$GITHUB_WORKSPACE/out/linux-headless" DrawboradHeadless \
            -C "$GITHUB_WORKSPACE" cloud/*.py cloud/requirements.txt cloud/static/index.html \
              tools/segmentation/guided_grabcut.py tools/models/sam3_semantic.py tools/packaging/install-runtime-ubuntu.sh
          (cd out && sha256sum DrawboradNativeEditor-ubuntu24-amd64.tar.gz > DrawboradNativeEditor-ubuntu24-amd64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: native-editor-host-${{ github.sha }}
          path: out/DrawboradNativeEditor-ubuntu24-amd64.tar.gz*
          if-no-files-found: error
          retention-days: 14
  runtime-install:
    needs: linux-headless
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-headless-runtime-${{ github.sha }}
          path: /tmp/download
      - name: Install and run extracted native package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime /tmp/runtime-evidence
          tar -xzf /tmp/download/DrawboradHeadless-ubuntu24-x86_64.tar.gz -C /tmp/runtime
          cd /tmp/runtime
          sha256sum -c SHA256SUMS | tee /tmp/runtime-evidence/checksums.log
          bash install-runtime-ubuntu.sh 2>&1 | tee /tmp/runtime-evidence/install.log
          ldd ./DrawboradHeadless | tee /tmp/runtime-evidence/linked-libraries.log
          ./DrawboradHeadless --help | tee /tmp/runtime-evidence/help.log
          ./DrawboradHeadless smoke --output /tmp/runtime-evidence/painting | tee /tmp/runtime-evidence/run.log
          python3 verify_artifacts.py /tmp/runtime-evidence/painting | tee /tmp/runtime-evidence/ora-validation.json
          python3 -c 'import json,os; r=json.load(open("/tmp/runtime-evidence/painting/report.json")); assert r["gitSha"] == os.environ["GITHUB_SHA"]; assert r["replaySourceAssetReads"] == 0'
          cp /etc/os-release /tmp/runtime-evidence/os-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-headless-runtime-validation-${{ github.sha }}
          path: /tmp/runtime-evidence/
          if-no-files-found: error
          retention-days: 14

  native-editor-browser:
    needs: linux-headless
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-editor-host-${{ github.sha }}
          path: out/host
      - uses: actions/download-artifact@v4
        with:
          name: linux-headless-p0-${{ github.sha }}
          path: out/native-evidence
      - name: Verify the deployable bundle
        working-directory: out/host
        run: |
          sha256sum -c DrawboradNativeEditor-ubuntu24-amd64.tar.gz.sha256
          tar xzf DrawboradNativeEditor-ubuntu24-amd64.tar.gz
          if env -u DRAWBORAD_CLOUD_TOKEN docker compose config --quiet; then
            echo 'Empty owner credential unexpectedly accepted' >&2
            exit 1
          fi
      - name: Install browser test dependencies
        run: |
          python3 -m venv out/browser-venv
          out/browser-venv/bin/pip install 'playwright>=1.50,<2' pillow
          out/browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the delivered editor in Chromium
        working-directory: out/host
        env:
          COMPOSE_PROJECT_NAME: drawborad-native-ci
          DRAWBORAD_NATIVE_PORT: "18767"
        run: |
          set -euo pipefail
          export DRAWBORAD_CLOUD_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$DRAWBORAD_CLOUD_TOKEN"
          trap 'docker compose logs --no-color editor; docker compose down --volumes' EXIT
          docker compose up -d --build --wait --wait-timeout 90
          ../browser-venv/bin/python ../../tests/cloud/browser_native_acceptance.py ../native-evidence/real-input ../browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-editor-browser-${{ github.sha }}
          path: out/browser-evidence/
          if-no-files-found: warn
          retention-days: 14
