name: Drawborad Linux headless P0
on:
  push:
    branches: [work/linux-headless-engine-20261104]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'apps/headless/**'
      - 'src/**'
      - 'src/ui/**'
      - 'src/codecs/**'
      - 'tools/qa/headless_evidence.py'
      - 'tests/**'
      - '.github/workflows/linux-headless-p0.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'apps/headless/**'
      - 'src/**'
      - 'src/ui/**'
      - 'src/codecs/**'
      - 'tools/qa/headless_evidence.py'
      - '.github/workflows/linux-headless-p0.yml'
permissions:
  contents: read
concurrency:
  group: drawborad-linux-headless-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-base-private-dev libpng-dev zlib1g-dev libjpeg-dev libtiff-dev libwebp-dev libheif-dev liblcms2-dev python3 python3-pil
      - name: Configure headless workflow
        shell: bash
        run: |
          mkdir -p out/evidence
          cmake -S . -B out/linux-headless -G Ninja -DCMAKE_BUILD_TYPE=Release -DDRAWBORAD_HEADLESS_WORKFLOW=ON -DDRAWBORAD_DESKTOP=OFF -DDRAWBORAD_QUALIFY=OFF -DDRAWBORAD_ONNXRUNTIME_ROOT= 2>&1 | tee out/evidence/configure.log
      - name: Build
        shell: bash
        run: cmake --build out/linux-headless --parallel 2 2>&1 | tee out/evidence/build.log
      - name: Run portable and headless tests
        shell: bash
        run: |
          ctest --test-dir out/linux-headless --show-only=json-v1 > out/evidence/ctest-inventory.json
          ctest --test-dir out/linux-headless --output-on-failure --no-tests=error --output-junit "$PWD/out/evidence/ctest.xml" 2>&1 | tee out/evidence/ctest.log
      - name: Generate genuine C++ painting artifacts
        run: out/linux-headless/DrawboradHeadless smoke --output out/evidence/painting > out/evidence/smoke-stdout.json
      - name: Independently verify ORA and collect receipts
        run: |
          python3 tests/headless/verify_artifacts.py out/evidence/painting > out/evidence/ora-validation.json
          python3 tools/qa/headless_evidence.py out/linux-headless out/evidence
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless-p0-${{ github.sha }}
          path: out/evidence/
          if-no-files-found: error
          retention-days: 14
