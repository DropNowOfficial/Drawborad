name: Color and model native verification
on:
  push:
    branches: [impl/color-formats-models-c01-c07-m01-m06]
  workflow_dispatch:
concurrency:
  group: cm-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tested source
        run: git archive --format=zip --output=drawborad-source.zip HEAD
      - name: Install native raster codec headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpng-dev libjpeg-dev libtiff-dev libwebp-dev libheif-dev
      - name: Configure portable core
        run: cmake --preset lab-debug
      - name: Build portable core
        run: cmake --build --preset lab-debug
      - name: Run portable tests
        run: ctest --preset lab-debug --output-on-failure --output-junit test-results.xml
      - name: Configure release stress
        run: cmake --preset lab-release
      - name: Build release stress
        run: cmake --build --preset lab-release
      - name: Run release stress
        run: ctest --preset lab-release --output-on-failure --output-junit release-results.xml
      - name: Configure sanitizer stress
        run: cmake --preset lab-asan
      - name: Build sanitizer stress
        run: cmake --build --preset lab-asan
      - name: Run sanitizer stress
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --preset lab-asan --output-on-failure --output-junit asan-results.xml
      - name: Retain source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-model-source-and-core
          path: |
            drawborad-source.zip
            out/build/lab-debug/test-results.xml
            out/build/lab-release/release-results.xml
            out/build/lab-asan/asan-results.xml
          retention-days: 7
